name: weighted-approval-review-event
run-name: weighted-approval-review-event:${{ github.event.pull_request.number }}

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

# Organization policy is optional; code-quality workflows run independently.
jobs:
  record-review-event:
    if: vars.DSH_ORGANIZATION_POLICY_ENABLED == '1' && github.event.pull_request.state == 'open'
    name: record weighted approval review event
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record review event
        run: echo 'Recorded a weighted approval review event.'
